<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">proto — your shell, with inline AI</title>
  <desc id="description">A dark violet and mint banner for proto: native Bash and Zsh, inline suggestions, reviewed plans, and local-first context.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#131929"/>
      <stop offset="1" stop-color="#0c101c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8b5cf6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b097ff"/>
      <stop offset="1" stop-color="#62e4b8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#70829f" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#surface)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <ellipse cx="980" cy="140" rx="290" ry="200" fill="url(#glow)"/>
  <rect x="56" y="57" width="76" height="76" rx="22" fill="#1c2440" stroke="#b097ff" stroke-opacity=".35"/>
  <path d="m77 78 18 17-18 17m24 0h13" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="153" y="116" fill="#e0e8f8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="70" font-weight="750" letter-spacing="-3">proto</text>
  <text x="59" y="175" fill="#b6c3dc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25">Your shell. A little more capable.</text>
  <g font-family="monospace" font-size="13" fill="#d6e0f4">
    <rect x="58" y="217" width="140" height="32" rx="16" fill="#1a2338" stroke="#2b3652"/>
    <text x="128" y="238" text-anchor="middle">BASH + ZSH</text>
    <rect x="210" y="217" width="164" height="32" rx="16" fill="#1a2338" stroke="#2b3652"/>
    <text x="292" y="238" text-anchor="middle">INLINE SUGGESTIONS</text>
    <rect x="386" y="217" width="155" height="32" rx="16" fill="#1a2338" stroke="#2b3652"/>
    <text x="464" y="238" text-anchor="middle">REVIEWED PLANS</text>
  </g>
  <g transform="translate(702 58)">
    <rect width="440" height="189" rx="16" fill="#0c101c" stroke="#2b3652"/>
    <path d="M16 0h408a16 16 0 0 1 16 16v20H0V16A16 16 0 0 1 16 0" fill="#1a2236"/>
    <circle cx="20" cy="18" r="4" fill="#ff778d"/>
    <circle cx="35" cy="18" r="4" fill="#f9c873"/>
    <circle cx="50" cy="18" r="4" fill="#62e4b8"/>
    <g font-family="monospace" font-size="17">
      <text x="25" y="78" fill="#62e4b8">~/project</text>
      <text x="139" y="78" fill="#e0e8f8">$ git st</text>
      <text x="221" y="78" fill="#70829f">atus --short</text>
      <path d="M221 62v21" stroke="#e0e8f8" stroke-width="1.5"/>
    </g>
    <path d="M25 103h390" stroke="#232d45"/>
    <text x="25" y="129" fill="#b097ff" font-family="monospace" font-size="13">TAB accepts. ENTER runs your input.</text>
    <text x="25" y="159" fill="#70829f" font-family="monospace" font-size="12">Local first · metadata only · you stay in control</text>
  </g>
</svg>
